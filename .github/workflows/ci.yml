name: CI

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v
        working-directory: mac-server
      - run: python -m unittest -v test_backend.py
        working-directory: ubuntu-server
      - run: python -m unittest -v test_backend.py
        working-directory: windows-server
      - run: python -m py_compile common/*.py mac-server/*.py ubuntu-server/*.py windows-server/*.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug assembleDebug
        working-directory: android-app
