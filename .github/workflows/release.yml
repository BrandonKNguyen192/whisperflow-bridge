name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whisperbridge-release.jks"
          chmod 600 "$RUNNER_TEMP/whisperbridge-release.jks"

      - name: Build signed Android APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/whisperbridge-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_code="$(tr -d '[:space:]' < builds/BUILD)"
          cd android-app
          ./gradlew clean assembleRelease -PVERSION_CODE="$version_code" -PVERSION_NAME="$version"
          cd ..
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk "dist/WhisperBridge-Android-v$version-build$version_code.apk"
          sha256sum "dist/WhisperBridge-Android-v$version-build$version_code.apk" > "dist/WhisperBridge-Android-v$version-build$version_code.apk.sha256"

      - name: Build desktop packages
        run: ./packaging/build-desktop-packages.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Whisper Bridge $GITHUB_REF_NAME"
